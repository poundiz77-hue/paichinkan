<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ไปจีนกัน</title>
<meta name="theme-color" content="#0F5A4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ไปจีนกัน">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--paper:#F3F6F4;--card:#FFFFFF;--ink:#17211F;--muted:#5C6B67;--jade:#0F5A4F;--jade-soft:#DDEDE7;--seal:#C2362B;--line:#DCE3E0;--on-jade:#FFFFFF;--gold:#C98F12;--warn-bg:#FFF4D6;--warn:#7A5300;--map-bg:#EAF3EC;--map-park:#D3E8DC;--map-water:#CFE3EE;--map-tree:#8FC2A4;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1614;--map-bg:#15221E;--map-park:#1C352D;--map-water:#18303B;--map-tree:#2F5A48;--card:#18221F;--ink:#E8EFEC;--muted:#9AABA6;--jade:#5FC2AE;--jade-soft:#1E332E;--seal:#E5594C;--line:#2A3733;--on-jade:#0F1614;--gold:#E7B84A;--warn-bg:#3A3014;--warn:#F2CF7A}}
:root[data-theme="dark"]{--paper:#0F1614;--map-bg:#15221E;--map-park:#1C352D;--map-water:#18303B;--map-tree:#2F5A48;--card:#18221F;--ink:#E8EFEC;--muted:#9AABA6;--jade:#5FC2AE;--jade-soft:#1E332E;--seal:#E5594C;--line:#2A3733;--on-jade:#0F1614;--gold:#E7B84A;--warn-bg:#3A3014;--warn:#F2CF7A}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:Prompt,"IBM Plex Sans Thai",Tahoma,sans-serif;font-weight:600;margin:0;line-height:1.25}
h1{font-size:26px}h2{font-size:18px}h3{font-size:17px}
.app{max-width:460px;margin:0 auto;padding:16px 16px 100px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.top small{color:var(--muted);font-size:13px;display:block}
.icon-btn{background:var(--card);border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;font-size:18px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.pill b{color:var(--jade);font-weight:500}
.ticket{position:relative;background:var(--jade);color:var(--on-jade);border-radius:18px;padding:20px 20px 16px;overflow:hidden}
.ticket .lbl{font-size:13px;opacity:.85}
.ticket .big{font-family:Prompt,sans-serif;font-size:40px;font-weight:600;line-height:1.1;margin:2px 0 10px}
.perf{position:relative;border-top:2px dashed color-mix(in srgb,var(--on-jade) 35%,transparent);margin:14px -20px 12px}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.perf::before{left:-10px}.perf::after{right:-10px}
.row{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.seal{position:absolute;right:16px;top:18px;width:78px;height:78px;border:3px solid var(--seal);border-radius:14px;transform:rotate(-8deg);display:grid;place-items:center;text-align:center;font-family:Prompt,sans-serif;font-weight:600;font-size:15px;line-height:1.15;color:var(--seal);background:color-mix(in srgb,var(--card) 92%,transparent)}
.meter{height:6px;border-radius:3px;background:color-mix(in srgb,var(--on-jade) 25%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--on-jade);border-radius:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:24px 0 8px}
.sec-h span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.city-card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:12px;padding:0}
.city-card svg{display:block;width:100%;height:120px}
.city-card .b{padding:12px 16px 14px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.city-card .cn{color:var(--muted);font-size:14px;margin-left:6px;font-family:"IBM Plex Sans Thai",sans-serif;font-weight:400}
.city-card p{margin:2px 0 0;font-size:14px;color:var(--muted)}
.city-card .n{font-size:13px;color:var(--jade);white-space:nowrap}
.place{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:14px}
.place .open{display:block;width:100%;text-align:left;background:none;border:none;padding:0}
.place svg{display:block;width:100%;height:140px}
.place .b{padding:12px 16px 14px}
.place .cn{font-size:13px;color:var(--muted)}
.place .m{font-size:14px;color:var(--muted);margin:6px 0 8px}
.fav{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:19px;display:grid;place-items:center;color:#C2362B;z-index:1}
.tag{display:inline-block;font-size:12px;background:var(--jade-soft);color:var(--jade);border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:2px;font-family:"IBM Plex Sans Thai",sans-serif;font-weight:500}
.status{display:inline-block;font-size:12px;border-radius:6px;padding:2px 8px;background:var(--warn-bg);color:var(--warn)}
.status.ok{background:var(--jade-soft);color:var(--jade)}
.scores{display:flex;gap:14px;font-size:13px;color:var(--muted);align-items:center;flex-wrap:wrap}
.scores b{color:var(--ink);font-weight:500}.star{color:var(--gold)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:10px;font-size:14px}
.tog{display:flex;align-items:center;gap:6px}.tog input{width:18px;height:18px;accent-color:var(--jade)}
.filters select{margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 10px;font-size:14px}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}
.empty{color:var(--muted);font-size:14px;padding:10px 0}
.conv{display:flex;align-items:center;gap:10px}
.conv input{flex:1;min-width:0;border:none;background:transparent;font-family:Prompt,sans-serif;font-size:34px;font-weight:600;padding:0;outline:none}
.conv .cur{font-family:Prompt,sans-serif;font-size:28px;color:var(--muted)}
.baht{font-size:15px;color:var(--muted);margin:4px 0 12px}.baht b{color:var(--jade);font-weight:500;font-size:20px}
.field{display:flex;gap:8px;margin-top:12px}
.field input,.field select,.sel{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px}
.field select{flex:0 0 110px}
.primary{width:100%;margin-top:12px;border:none;border-radius:12px;background:var(--jade);color:var(--on-jade);padding:13px;font-size:16px;font-weight:500}
.ghost{width:100%;background:transparent;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:15px;margin-top:10px;color:var(--ink)}
.err{color:var(--seal);font-size:13px;margin:6px 0 0}
.exp{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.exp:last-child{border-bottom:none}
.exp .ic{width:38px;height:38px;border-radius:10px;background:var(--jade-soft);display:grid;place-items:center;font-size:18px;flex:none}
.exp .t{flex:1;min-width:0}.exp .t p{margin:0;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.exp .t small{color:var(--muted);font-size:12px}
.exp .amt{text-align:right;font-size:15px;font-weight:500}.exp .amt small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.del{border:none;background:transparent;color:var(--muted);font-size:20px;padding:4px 8px}
.bars div{display:flex;align-items:center;gap:10px;font-size:13px;margin:6px 0}
.bars span:first-child{width:80px}.bars .tr{flex:1;height:8px;border-radius:4px;background:var(--jade-soft)}.bars .tr i{display:block;height:100%;border-radius:4px;background:var(--jade)}
.bars span:last-child{width:62px;text-align:right;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{border:none;background:transparent;border-radius:9px;padding:8px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--jade);color:var(--on-jade);font-weight:500}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--jade);flex:none}
.item .go{flex:1;text-align:left;background:none;border:none;padding:0;font-size:15px}
.item small{color:var(--muted);font-size:12px;display:block}
.route{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.route .ft{font-size:16px;font-weight:500}.route .ft span{color:var(--muted);font-weight:400}
.route .meta{display:flex;gap:14px;font-size:13px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.tl{margin-top:16px;position:relative}
.step{display:grid;grid-template-columns:44px 1fr;gap:12px;position:relative;padding-bottom:18px}
.step:not(:last-child)::before{content:"";position:absolute;left:21px;top:44px;bottom:0;width:2px;background:var(--line)}
.step .ico{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:var(--jade-soft)}
.step .tx{padding-top:2px}.step p{margin:0;font-size:15px}
.step .ln{display:inline-block;color:#fff;font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;margin-right:6px;vertical-align:1px}
.step small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.sum small{display:block;font-size:12px;color:var(--muted)}.sum b{font-family:Prompt,sans-serif;font-size:22px;font-weight:600}
.back{display:inline-flex;align-items:center;gap:6px;border:none;background:none;color:var(--jade);font-size:15px;padding:4px 0;margin-bottom:8px}
.detail{position:fixed;inset:0;background:var(--paper);overflow-y:auto;z-index:20;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.detail .hero{position:relative}.detail .hero svg{display:block;width:100%;height:220px}
.detail .close{position:absolute;top:12px;left:12px;width:42px;height:42px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:20px;color:#17211F}
.detail .in{max-width:460px;margin:0 auto;padding:16px 16px 40px}
.info{margin-top:14px}.info div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.info div span:first-child{color:var(--muted);flex:none}.info div span:last-child{text-align:right}
.cnbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.cnbox .big{font-size:22px;font-weight:500}
.small-btn{border:1px solid var(--jade);background:transparent;color:var(--jade);border-radius:10px;padding:8px 12px;font-size:14px;font-weight:500;white-space:nowrap}
.mine{display:flex;gap:4px}.mine button{border:none;background:transparent;font-size:30px;padding:0 2px;color:var(--line);line-height:1}.mine button.on{color:var(--gold)}
.acts{display:grid;gap:10px;margin-top:14px}
.acts a{display:block;text-align:center;text-decoration:none;border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);background:var(--card)}
.add{display:flex;gap:8px}.add select{flex:0 0 120px}
.driver{position:fixed;inset:0;z-index:30;background:#101614;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px))}
.driver .ask{font-size:22px;opacity:.8;margin-bottom:12px}
.driver .name{font-size:44px;font-weight:600;line-height:1.3;word-break:break-all}
.driver .th{margin-top:18px;opacity:.7;font-size:15px}
.driver button{margin-top:32px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:12px;padding:10px 22px;font-size:15px}
.settings{display:none}.settings.open{display:block}
.settings label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
.settings input{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:4px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
nav div{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:none;background:transparent;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}
nav button[aria-current="page"]{color:var(--jade);font-weight:500}
.trail{margin-top:14px;border-radius:18px;overflow:hidden;border:1px solid var(--line)}.trail svg{display:block;width:100%;height:auto}
.lockb{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;border-radius:999px;padding:3px 10px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.freeb{background:var(--jade-soft);border-color:transparent;color:var(--jade);font-weight:500}
.locked svg{filter:grayscale(.6);opacity:.75}
.banner{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px;font-size:14px}
.banner b{font-weight:500}.banner span:last-child{color:var(--jade);white-space:nowrap}
.sheet-bg{position:fixed;inset:0;background:rgba(10,16,14,.45);z-index:35;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:460px;border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow-y:auto}
.sheet h2{font-size:21px}.sheet .sub{color:var(--muted);font-size:14px;margin:4px 0 14px}
.perks{list-style:none;padding:0;margin:0 0 14px}.perks li{padding:5px 0;font-size:15px}.perks li::before{content:"✓";color:var(--jade);font-weight:600;margin-right:8px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left}
.plan.best{border:2px solid var(--jade)}
.plan .pb{position:absolute;top:-10px;right:10px;background:var(--seal);color:#fff;font-size:11px;border-radius:999px;padding:2px 8px}
.plan small{display:block;color:var(--muted);font-size:12px}.plan b{font-family:Prompt,sans-serif;font-size:24px;font-weight:600;display:block;margin:2px 0}
.codeRow{display:flex;gap:8px;margin-top:8px}.codeRow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.codeRow button{border:none;border-radius:10px;background:var(--jade);color:var(--on-jade);padding:0 16px;font-weight:500}
.linkish{background:none;border:none;color:var(--muted);font-size:14px;padding:10px 0 0;width:100%}
.zone{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:10px}
.zone h3{font-size:16px}.zone .cn{color:var(--muted);font-size:13px;margin-left:6px;font-weight:400;font-family:"IBM Plex Sans Thai",sans-serif}
.zone p{margin:6px 0 0;font-size:14px;color:var(--muted)}.zone .ln{display:inline-block;color:#fff;font-size:12px;font-weight:500;border-radius:6px;padding:2px 8px;margin-right:6px}
.getthere p{margin:8px 0 0;font-size:14px}.getthere .muted{color:var(--muted)}
.seg{grid-template-columns:repeat(4,1fr)!important}
.tk{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;margin-top:12px;overflow:hidden}
.tk.past{opacity:.55}
.tk .hd{display:flex;justify-content:space-between;align-items:center;background:var(--jade);color:var(--on-jade);padding:10px 16px;font-size:14px}
.tk .hd b{font-family:Prompt,sans-serif;font-weight:600;font-size:16px}
.tk .cd{font-size:12px;background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px}
.tk .main{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:14px 16px 10px}
.tk .pt small{display:block;color:var(--muted);font-size:12px}.tk .pt b{display:block;font-family:Prompt,sans-serif;font-size:18px;font-weight:600;line-height:1.25}
.tk .pt .tm{font-size:22px;color:var(--jade)}.tk .pt.r{text-align:right}
.tk .mid{text-align:center;color:var(--muted);font-size:20px}
.tk .cut{position:relative;border-top:2px dashed var(--line);margin:0}
.tk .cut::before,.tk .cut::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--line)}
.tk .cut::before{left:-11px}.tk .cut::after{right:-11px}
.tk .ft{display:flex;flex-wrap:wrap;gap:16px;padding:10px 16px;font-size:13px}.tk .ft span{color:var(--muted)}.tk .ft b{display:block;color:var(--ink);font-weight:500;font-size:14px}
.tk .acts2{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.tk .acts2 button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:7px 12px;font-size:13px}
.tform label{display:block;font-size:13px;color:var(--muted);margin-top:10px}
.tform input,.tform textarea{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;font-size:15px;margin-top:4px}
.tform .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nextTk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px;font-size:14px}
.nextTk .i{font-size:22px}.nextTk small{display:block;color:var(--muted);font-size:12px}
.imgview{position:fixed;inset:0;z-index:36;background:#0b0f0e;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.imgview img{max-width:100%;max-height:80vh;border-radius:8px;background:#fff}
.imgview button{margin-top:16px;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;border-radius:12px;padding:10px 22px;font-size:15px}
.dtk{display:flex;gap:10px;align-items:center;background:var(--jade-soft);border-radius:12px;padding:10px 12px;margin-top:8px;font-size:14px;width:100%;border:none;text-align:left}
.scanbox{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--jade-soft);border:1px dashed var(--jade);border-radius:14px;padding:12px 14px;margin-top:12px;color:var(--ink)}

const TYPE_ICON={"สัตว์":"🐼","ธรรมชาติ":"⛰️","เมือง":"🌃","วัฒนธรรม":"🏮","ประวัติศาสตร์":"🏯","ช้อปปิ้ง":"🛍️","สวนสนุก":"🎡","ทะเล":"🏖️"};
const thOnly=t=>String(t||"").replace(/[\u3400-\u9fff（）()]+/g,"").trim();
const clip=(t,n)=>t.length>n?t.slice(0,n-1)+"…":t;
function trailMap(nodes,segs,title){
 const n=nodes.length,gap=128,top=104,H=top+(n-1)*gap+96,W=360;
 const P=nodes.map((_,i)=>({x:i%2?258:102,y:top+i*gap}));
 let bg=`<rect width="${W}" height="${H}" style="fill:var(--map-bg)"/>`;
 bg+=`<path d="M0 ${top+gap*0.5+30} C90 ${top+gap*0.5-10} 150 ${top+gap*0.5+70} 240 ${top+gap*0.5+30} S330 ${top+gap*0.5+10} 360 ${top+gap*0.5+40} L360 ${top+gap*0.5+62} C330 ${top+gap*0.5+32} 300 ${top+gap*0.5+56} 240 ${top+gap*0.5+52} S90 ${top+gap*0.5+10} 0 ${top+gap*0.5+52}Z" style="fill:var(--map-water)"/>`;
 P.forEach((p,i)=>{const ox=p.x<180?300:60;bg+=`<ellipse cx="${ox}" cy="${p.y+6}" rx="46" ry="30" style="fill:var(--map-park)"/>`;
  [[-14,-4,9],[4,-10,11],[16,4,8],[-4,8,7]].forEach(([dx,dy,r])=>bg+=`<circle cx="${ox+dx}" cy="${p.y+dy}" r="${r}" style="fill:var(--map-tree)"/>`)});
 for(let i=0;i<n-1;i++){const cy=(P[i].y+P[i+1].y)/2,cx=P[i].x<180?40:320;bg+=`<g style="fill:var(--card)" opacity=".7"><ellipse cx="${cx}" cy="${cy-30}" rx="18" ry="7"/><ellipse cx="${cx+10}" cy="${cy-35}" rx="11" ry="7"/></g>`}
 bg+=`<g transform="translate(326 30)"><circle r="16" style="fill:var(--card);stroke:var(--line)" stroke-width="1"/><path d="M0 -11 L4 0 L0 -2 L-4 0Z" style="fill:var(--seal)"/><path d="M0 11 L4 0 L0 2 L-4 0Z" style="fill:var(--muted)"/><text y="-19" text-anchor="middle" font-size="9" style="fill:var(--muted)">N</text></g>`;
 bg+=`<g transform="translate(16 18)"><rect width="${Math.min(250,40+title.length*8)}" height="30" rx="8" style="fill:var(--jade)"/><text x="12" y="20" font-size="14" font-weight="600" font-family="Prompt,sans-serif" style="fill:var(--on-jade)">🗺️ ${esc(clip(title,26))}</text></g>`;
 let paths="",badges="";
 for(let i=0;i<n-1;i++){const a=P[i],b=P[i+1],sg=segs[i]||{};const col=sg.color||"var(--jade)";
  const d=`M${a.x} ${a.y} C${a.x} ${a.y+64} ${b.x} ${b.y-64} ${b.x} ${b.y}`;
  paths+=`<path d="${d}" fill="none" style="stroke:var(--card)" stroke-width="9" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${esc(col)}" stroke-width="4" stroke-linecap="round" ${sg.solid?"":'stroke-dasharray="2 9"'}/>`;
  const mx=(a.x+b.x)/2,my=(a.y+b.y)/2,txt=sg.text||"",w=txt?36+txt.length*7:34;
  badges+=`<g transform="translate(${mx-w/2} ${my-15})"><rect width="${w}" height="30" rx="15" style="fill:var(--card);stroke:var(--line)" stroke-width="1"/><text x="${txt?17:w/2}" y="20" font-size="15" text-anchor="middle">${sg.icon||"•"}</text>${txt?`<text x="30" y="19.5" font-size="12" font-weight="500" style="fill:var(--ink)">${esc(txt)}</text>`:""}</g>`}
 let pins="";
 nodes.forEach((nd,i)=>{const p=P[i],end=i===n-1&&n>1,start=i===0;
  pins+=`<g transform="translate(${p.x} ${p.y})"><ellipse cx="0" cy="26" rx="22" ry="5" style="fill:var(--map-tree)" opacity=".5"/><circle r="28" style="fill:var(--card);stroke:${end?"var(--seal)":"var(--jade)"}" stroke-width="3"/><text y="9" font-size="25" text-anchor="middle">${nd.icon}</text>
  ${start?`<g transform="translate(-30 -40)"><rect width="38" height="18" rx="9" style="fill:var(--jade)"/><text x="19" y="13" font-size="10" font-weight="600" text-anchor="middle" style="fill:var(--on-jade)">เริ่ม</text></g>`:""}
  ${end?`<g transform="translate(16 -46)"><line x1="0" y1="0" x2="0" y2="24" style="stroke:var(--ink)" stroke-width="2"/><path d="M0 0 L18 5 L0 11Z" style="fill:var(--seal)"/></g>`:""}
  ${!start&&!end?`<g transform="translate(18 -30)"><circle r="10" style="fill:var(--jade)"/><text y="4" font-size="11" font-weight="600" text-anchor="middle" style="fill:var(--on-jade)">${i}</text></g>`:""}
  <text y="48" font-size="13" font-weight="600" text-anchor="middle" font-family="Prompt,sans-serif" style="fill:var(--ink);paint-order:stroke;stroke:var(--map-bg);stroke-width:4px">${esc(clip(nd.label,24))}</text>${nd.sub?`<text y="63" font-size="11" text-anchor="middle" style="fill:var(--muted);paint-order:stroke;stroke:var(--map-bg);stroke-width:3px">${esc(clip(nd.sub,24))}</text>`:""}</g>`});
 return `<div class="trail"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="แผนที่การเดินทางแบบภาพร่าง ${esc(title)}">${bg}${paths}${badges}${pins}</svg></div>`;
}
function routeTrail(r){
 const to=placeOf(r.to),zn=zoneOf(r.to),nodes=[{label:thOnly(r.from),icon:/สนามบิน/.test(r.from)?"✈️":"🏨",sub:"จุดเริ่มต้น"}],segs=[];
 r.steps.forEach((st,i)=>{const last=i===r.steps.length-1,nx=r.steps[i+1];
  const label=last?(to?to.th:zn?zn.name:thOnly(st.alight)):thOnly(st.alight)||thOnly(nx&&nx.board)||st.mode;
  const icon=last?(to?TYPE_ICON[to.type]||"📍":zn?"🏨":"📍"):(/รถไฟ/.test((nx&&nx.mode)||"")||/รถไฟ/.test(st.mode)?"🚉":"📍");
  nodes.push({label:icon==="🚉"&&!/^สถานี/.test(label)?"สถานี"+label:label,icon,sub:last?"ถึงแล้ว!":(st.exit?"ทางออก "+st.exit:"")});
  segs.push({icon:MODE[st.mode]||"•",text:(st.line?st.line+" · ":"")+st.min+" นาที",color:st.color||null,solid:st.mode==="รถไฟใต้ดิน"||st.mode==="รถไฟความเร็วสูง"})});
 return trailMap(nodes,segs,"ไป"+destName(r.to)); }
function accessTrail(p){
 const me={label:"คุณอยู่ตรงนี้",icon:"📍",sub:"Amap นำทางต่อ"},dest={label:p.th,icon:TYPE_ICON[p.type]||"📍",sub:"ถึงแล้ว!"};
 const mode=/ความเร็วสูง/.test(p.line)?"🚄":/สาย/.test(p.line)?"🚇":/กระเช้า/.test(p.line)?"🚡":/เดิน/.test(p.line)?"🚶":"🚌";
 if(p.station){
  const last=p.walkMin?{icon:"🚶",text:p.walkMin+" นาที"}:{icon:"🚕",text:"ต่อรถ"};
  return trailMap([me,{label:/^สถานี/.test(p.station)?p.station:"สถานี"+p.station,icon:"🚉",sub:(p.stationCn||"")+(p.exit?" · ทางออก "+p.exit:"")},dest],[{icon:mode,text:p.line,color:p.lineColor||null,solid:true},last],"วิธีไป"+p.th);
 }
 return trailMap([me,dest],[{icon:"🚕",text:"แท็กซี่ / รถ"}],"วิธีไป"+p.th);
}
function dayTrail(day,items){
 const nodes=items.map(p=>({label:p.th,icon:TYPE_ICON[p.type]||"📍",sub:cityOf(p.c)?cityOf(p.c).th:""}));
 return trailMap(nodes,items.slice(1).map(()=>({icon:"👣"})),"เส้นทางวันที่ "+day);
}

async function redeem(){

 if(API_URL){
  if(!navigator.onLine){$("codeErr").textContent="ต้องต่ออินเทอร์เน็ตเพื่อเช็กรหัส";return}

   if(!j.ok){$("codeErr").textContent=j.error||"รหัสนี้ใช้ไม่ได้";return}res={type:j.type,expires:j.expires?Date.parse(j.expires):null}}catch(e){$("codeErr").textContent="เช็กรหัสไม่สำเร็จ ลองใหม่อีกครั้ง";return}

  res={type:d.type,expires:PASS_DAYS[d.type]?Date.now()+PASS_DAYS[d.type]*864e5:null};
 }
 S.unlock={type:res.type,expires:res.expires,code};save();closeSheet();renderAll();
 toast(res.type==="lifetime"?"ปลดล็อกตลอดชีพแล้ว":"ปลดล็อก"+(PASS_NAME[res.type]||"พาส")+"แล้ว");

const TK_ICON={flight:"✈️",train:"🚄",other:"🎫"},TK_NAME={flight:"เที่ยวบิน",train:"รถไฟ",other:"ตั๋วอื่น ๆ"};
const idb=(()=>{let p;const db=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open("paichinkan",1);r.onupgradeneeded=()=>r.result.createObjectStore("img");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}}));
 const run=(mode,fn)=>db().then(d=>new Promise((res,rej)=>{const q=fn(d.transaction("img",mode).objectStore("img"));q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
 return{get:k=>run("readonly",o=>o.get(k)).catch(()=>null),set:(k,v)=>run("readwrite",o=>o.put(v,k)),del:k=>run("readwrite",o=>o.delete(k)).catch(()=>{})}})();
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const thShort=ds=>new Date(ds+"T00:00:00").toLocaleDateString("th-TH",{weekday:"short",day:"numeric",month:"short"});
function dayDate(d){if(!S.trip.startDate)return null;const x=new Date(S.trip.startDate+"T00:00:00");x.setDate(x.getDate()+d-1);return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
function daysUntil(ds){return Math.round((new Date(ds+"T00:00:00")-new Date(todayStr()+"T00:00:00"))/864e5)}
function sortedTickets(){const t=todayStr();return [...S.tickets].sort((a,b)=>{const pa=a.date<t,pb=b.date<t;if(pa!==pb)return pa?1:-1;return (a.date+(a.dep||"")).localeCompare(b.date+(b.dep||""))})}
function nextTicket(){const t=todayStr();return sortedTickets().find(x=>x.date>=t)}
function ticketCard(x){
 const n=daysUntil(x.date),past=n<0,cd=past?"ผ่านไปแล้ว":n===0?"วันนี้":n===1?"พรุ่งนี้":`อีก ${n} วัน`;
 const f=[["ที่นั่ง",x.seat],[x.kind==="flight"?"เกต / อาคาร":"ชานชาลา / ประตู",x.gate],["รหัสจอง",x.ref]].filter(a=>a[1]);
 return `<article class="tk${past?" past":""}" id="tk-${x.id}"><div class="hd"><span>${TK_ICON[x.kind]} <b>${esc(x.no||TK_NAME[x.kind])}</b></span><span class="cd">${cd}</span></div>
 <div class="main"><div class="pt"><small>${esc(thShort(x.date))}</small><b>${esc(x.from)}</b>${x.fromCn?`<small>${esc(x.fromCn)}</small>`:""}${x.dep?`<b class="tm">${esc(x.dep)}</b>`:""}</div><div class="mid">${x.kind==="flight"?"✈":"→"}</div>
 <div class="pt r"><small>&nbsp;</small><b>${esc(x.to)}</b>${x.toCn?`<small>${esc(x.toCn)}</small>`:""}${x.arr?`<b class="tm">${esc(x.arr)}</b>`:""}</div></div>
 ${f.length||x.note?`<div class="cut"></div><div class="ft">${f.map(a=>`<div><span>${a[0]}</span><b>${esc(a[1])}</b></div>`).join("")}${x.note?`<div style="width:100%"><span>หมายเหตุ</span><b>${esc(x.note)}</b></div>`:""}</div>`:""}
 <div class="acts2">${x.hasImg?`<button data-tk-img="${x.id}">🖼️ ดูรูปตั๋ว</button>`:""}${x.fromCn?`<button data-tk-cn="${x.id}">🚕 โชว์คนขับ</button>`:""}<button data-tk-edit="${x.id}">แก้ไข</button><button data-tk-del="${x.id}">ลบ</button></div></article>`;
}

function compressImg(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",0.8))};im.src=r.result};r.readAsDataURL(file)})}

async function scanTicket(file){
 const btn=$("scanBtn"),note=$("scanNote"),err=$("tErr");err.textContent="";
 btn.classList.add("scanning");btn.querySelector("b").textContent="กำลังอ่านตั๋ว…";
 const done=()=>{btn.classList.remove("scanning");btn.querySelector("b").textContent="สแกนตั๋วด้วย AI"};
 let img;try{img=await compressImg(file)}catch(e){done();err.textContent="อ่านรูปไม่ได้ ลองรูปอื่น";return}
 let t=null;
 if(API_URL){
  if(!navigator.onLine){done();err.textContent="ต้องต่ออินเทอร์เน็ตเพื่อสแกนตั๋ว";return}
  try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({action:"scanTicket",code:S.unlock&&S.unlock.code,deviceId:S.deviceId,image:img.split(",")[1]})});const j=await r.json();
   if(!j.ok){done();err.textContent=j.error||"สแกนไม่สำเร็จ";return}t=j.ticket}catch(e){done();err.textContent="สแกนไม่สำเร็จ ลองใหม่อีกครั้ง หรือกรอกเอง";return}
 }else{
  await new Promise(r=>setTimeout(r,1200));
  t={kind:"train",no:"G8601",from:"เฉิงตูตะวันออก",fromCn:"成都东站",to:"ฉงชิ่งเหนือ",toCn:"重庆北站",date:todayStr(),dep:"10:05",arr:"11:15",seat:"ตู้ 5 ที่ 8F",gate:"",ref:"E12345678",note:"ต้องใช้พาสปอร์ตตัวจริงขึ้นรถไฟ"};
  note.textContent="โหมดตัวอย่าง: ต้นแบบนี้ยังไม่ได้ต่อ AI จริง ข้อมูลด้านล่างเป็นข้อมูลตัวอย่าง";
 }
 done();tkImgData=img;
 tkKind=t.kind||"other";document.querySelectorAll("[data-tk-kind]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tkKind===tkKind));
 const set=(id,v)=>{if(v)$(id).value=v};
 set("tNo",t.no);set("tFrom",t.from);set("tFromCn",t.fromCn);set("tTo",t.to);set("tToCn",t.toCn);set("tDate",t.date);set("tDep",t.dep);set("tArr",t.arr);set("tSeat",t.seat);set("tGate",t.gate);set("tRef",t.ref);set("tNote",t.note);
 toast("อ่านตั๋วแล้ว ตรวจข้อมูลก่อนบันทึกนะ");
}
async function dlCity(c){

 let ok=0;toast(`กำลังเก็บรูป 0/${urls.length}`);
 for(let i=0;i<urls.length;i+=4){await Promise.all(urls.slice(i,i+4).map(u=>fetch(u,{mode:"no-cors"}).then(()=>ok++).catch(()=>{})));toast(`กำลังเก็บรูป ${ok}/${urls.length}`)}

 else if(d.driver){showDriver(d.driver)}
 else if(d.driverClose!==undefined){$("driver").hidden=true}
 else if(d.rate){const n=+d.n,cur=S.myRate[d.rate];S.myRate[d.rate]=cur===n?0:n;S.pending=S.pending.filter(x=>x.placeId!==d.rate);if(S.myRate[d.rate])S.pending.push({placeId:d.rate,stars:n});save();openDetail(d.rate);toast(S.myRate[d.rate]?`ให้ ${n} ดาวแล้ว`:"ยกเลิกคะแนนแล้ว");flushRatings()}
 else if(d.add){const day=parseInt($("dDay").value)||1;S.plan=S.plan.filter(x=>x.pid!==d.add);S.plan.push({pid:d.add,day});save();openDetail(d.add);renderTrip();toast(`เพิ่มลงแผนวันที่ ${day} แล้ว`)}
 else if(d.rm){S.plan=S.plan.filter(x=>x.pid!==d.rm);save();renderTrip()}
 else if(d.route){const r=D.routes.find(x=>x.id===d.route);if(!r)return;gate(r.c,()=>{closeDetail();openRoute=r.id;rCity=r.c;renderRoutes();go("routes")})}
 else if(d.rback!==undefined){openRoute=null;renderRoutes();window.scrollTo(0,0)}
 else if(d.rcity){rCity=d.rcity;renderRoutes()}
 else if(d.seg){seg=d.seg;renderTrip()}
 else if(d.tkNew!==undefined){ticketForm(null)}
 else if(d.aff){openAff(d.aff,d.affCity||"")}
 else if(d.dlCity){dlCity(d.dlCity)}
 else if(d.chk){S.checklist[d.chk]=!S.checklist[d.chk];save();renderChecklist()}
 else if(d.chkHide!==undefined){S.checklist._hide=true;save();renderChecklist()}
 else if(d.payInfo!==undefined){showPayInfo()}
 else if(d.tkKind){tkKind=d.tkKind;document.querySelectorAll("[data-tk-kind]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.tkKind===tkKind))}
 else if(d.tkSave!==undefined){saveTicket()}
 else if(d.tkScan!==undefined){if(!isPremium()){closeSheet();pendingGate={c:null,cb:()=>{seg="tickets";renderTrip();ticketForm(null)}};showPlans(null);return}$("scanFile").click()}
 else if(d.tkEdit){ticketForm(d.tkEdit)}
 else if(d.tkDel){if(confirm("ลบตั๋วนี้?")){S.tickets=S.tickets.filter(t=>t.id!==d.tkDel);idb.del(d.tkDel);save();renderTrip();renderHomeNext();toast("ลบตั๋วแล้ว")}}
 else if(d.tkImg){showTicketImg(d.tkImg)}
 else if(d.imgClose!==undefined){$("imgView").hidden=true}
 else if(d.tkCn){const x=S.tickets.find(t=>t.id===d.tkCn);if(x)showDriverText(x.fromCn,x.from)}
 else if(d.tkGo){seg="tickets";renderTrip();go("trip");setTimeout(()=>{const el=$("tk-"+d.tkGo);if(el)el.scrollIntoView({block:"center"})},50)}
 else if(d.cat){cat=d.cat;renderTrip()}
 else if(d.del){S.expenses=S.expenses.filter(x=>x.id!=d.del);save();renderTrip();renderHome()}
});
["fFree","fFav","sort"].forEach(id=>$(id).addEventListener("change",renderPlaces));

 S.expenses.push({id:Date.now(),cny:v,cat,note:$("note").value.trim(),day:parseInt($("daySel").value)||1});
 save();$("cny").value="";$("note").value="";renderTrip();renderHome();

$("sSave").addEventListener("click",()=>{
 const b=parseFloat($("sBudget").value),dd=parseInt($("sDays").value),rv=$("sRate").value.trim(),r=rv?parseFloat(rv):null;

 $("sErr").textContent="";S.trip={name:$("sName").value.trim(),budget:b,days:dd,rateOverride:r,startDate:$("sStart").value||null};
 S.expenses.forEach(x=>{if(x.day>dd)x.day=dd});S.plan=S.plan.filter(x=>x.day<=dd);
 save();$("settings").classList.remove("open");renderAll();toast("บันทึกการตั้งค่าแล้ว");
});
$("reset").addEventListener("click",()=>{if(!confirm("ล้างงบ แผน ตั๋ว และที่อยากไปทั้งหมด?"))return;S.tickets.forEach(t=>idb.del(t.id));S.expenses=[];S.plan=[];S.fav=[];S.tickets=[];save();$("settings").classList.remove("open");renderAll();toast("ล้างข้อมูลทริปแล้ว")});
$("sheetBg").addEventListener("click",e=>{if(e.target.id==="sheetBg"){closeSheet();pendingGate=null}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="codeIn")redeem();if(e.key==="Escape"){if(!$("imgView").hidden){$("imgView").hidden=true;return}if(!$("sheetBg").hidden){closeSheet();return}if(!$("driver").hidden)$("driver").hidden=true;else if(!$("detail").hidden)closeDetail()}});

/* ---------- sync กับหลังบ้าน (ทำงานเมื่อใส่ API_URL) ---------- */
async function syncData(){
 if(!API_URL||!navigator.onLine)return;
 const age=S.cache?Date.now()-S.cache.fetchedAt:Infinity;
 if(age<(D.cacheHours||24)*3600e3)return;
 try{const r=await fetch(API_URL+"?action=all");const j=await r.json();if(j.ok){S.cache={fetchedAt:Date.now(),payload:normalize(j)};D=S.cache.payload;save();renderAll()}}catch(e){}
}
function normalize(j){return{affiliates:j.affiliates||[],prices:j.prices||EMBED.prices,buyUrl:j.buyUrl||"",dataVersion:j.dataVersion,lastUpdated:j.lastUpdated,rate:j.rate||EMBED.rate,cacheHours:j.cacheHours,cities:j.cities.map(c=>({id:c.id,th:c.nameTh,en:c.nameEn,cn:c.nameCn,desc:c.desc,style:c.style,season:c.season,image:String(c.image||"").split("\n")[0]||""})),
 places:j.places.map(p=>{const old=EMBED.places.find(x=>x.id===p.id);return{id:p.id,c:p.id.slice(0,2),th:p.nameTh,en:p.nameEn,cn:p.nameCn,type:p.type,price:p.price,free:p.free,booking:p.booking,desc:p.desc,status:p.status,note:p.note||"",hours:p.hours,team:p.teamStars,uStars:p.userStars,uCount:p.userCount,images:p.images||(p.image?String(p.image).split("\n").filter(Boolean):[]),imageCredits:p.imageCredits||[],art:old?old.art:"city",station:p.station||"",stationCn:p.stationCn||"",line:p.line||"",lineColor:p.lineColor||"",exit:p.exit||"",walkMin:p.walkMin||0,access:p.access||""}}),
 zones:(j.zones||[]).map(z=>({id:z.id,c:z.id.slice(0,2),name:z.name,cn:z.nameCn,station:z.station,stationCn:z.stationCn,line:z.line,lineColor:z.lineColor,goodFor:z.goodFor,desc:z.desc,status:z.status})),
 routes:j.routes.map(r=>({id:r.id,c:r.id.slice(0,2),from:r.from,to:r.toPlaceId,min:r.totalMin,cny:r.totalCny,status:r.status,steps:r.steps}))}}
async function flushRatings(){
 if(!API_URL||!navigator.onLine||!S.pending.length)return;
 const q=[...S.pending];
 for(const it of q){try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify({placeId:it.placeId,deviceId:S.deviceId,stars:it.stars})});const j=await r.json();if(j.ok){S.pending=S.pending.filter(x=>x!==it&&!(x.placeId===it.placeId&&x.stars===it.stars));const p=placeOf(it.placeId);if(p){p.uStars=j.userStars;p.uCount=j.userCount}}}catch(e){break}}
 save();
}
window.addEventListener("online",()=>{syncData();flushRatings()});
save();renderAll();syncData();flushRatings();
/* ---------- PWA: ติดตั้งและออฟไลน์ ---------- */
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
(function(){
 const box=$("installBox");let dismissed=false;try{dismissed=localStorage.getItem("installHidden")==="1"}catch(e){}
 const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
 if(standalone||dismissed)return;
 const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
 const hide=()=>{box.hidden=true;try{localStorage.setItem("installHidden","1")}catch(e){}};
 if(ios){box.innerHTML='<b>📲 ติดตั้งเป็นแอป</b> ใช้ออฟไลน์ได้ตอนอยู่จีน<br>ใน Safari กดปุ่มแชร์ <b>⬆︎</b> แล้วเลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b><div class="row"><button id="instHide">ไม่ต้องแสดงอีก</button><span></span></div>';box.hidden=false;$("instHide").onclick=hide;return}
 window.addEventListener("beforeinstallprompt",ev=>{ev.preventDefault();const p=ev;
  box.innerHTML='<b>📲 ติดตั้งเป็นแอป</b> ใช้ออฟไลน์ได้ตอนอยู่จีน<div class="row"><button id="instHide">ไม่ต้องแสดงอีก</button><button class="go" id="instGo">ติดตั้ง</button></div>';box.hidden=false;
  $("instHide").onclick=hide;$("instGo").onclick=async()=>{p.prompt();try{await p.userChoice}catch(e){}hide()}});
})();
